<body>
<div id="root"></div>
<script type="text/babel">
const { Tabs } = window.SaxaabDesignSystem_624abb;
function Demo(){
  const [tab, setTab] = React.useState("Overview");
  return <div style={{display:"flex",flexDirection:"column",gap:12}}>
    <Tabs tabs={["Overview","Pricing","FAQ"]} value={tab} onChange={setTab} />

  </div>;
}
