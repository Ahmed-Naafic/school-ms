<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:18px 20px;background:var(--surface-card);font-family:var(--font-body)} a{color:var(--link)}a:hover{color:var(--link-hover)}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Input, Select, Checkbox, Radio, Switch } = window.SaxaabDesignSystem_624abb;
function Demo(){
  const [plan, setPlan] = React.useState("monthly");
  return <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"16px 24px"}}>
    <Input label="Work email" placeholder="you@company.com" hint="We reply within one business day" />
    <Input label="Company" placeholder="Company name" error="Company is required" />
    <Select label="Service" options={["Managed IT support","Cloud & hosting","Network & security"]} />
    <div style={{display:"flex",flexDirection:"column",gap:10,paddingTop:24}}>
      <Checkbox label="Include on-site support" defaultChecked />
      <Checkbox label="Send me the service catalogue" />
      <Checkbox label="Disabled option" disabled />
    </div>
    <div style={{display:"flex",gap:20,alignItems:"center"}}>
      <Radio label="Monthly" checked={plan==="monthly"} onChange={()=>setPlan("monthly")} />
      <Radio label="Quarterly" checked={plan==="quarterly"} onChange={()=>setPlan("quarterly")} />
      <Radio label="Annual" checked={plan==="annual"} onChange={()=>setPlan("annual")} />
    </div>
    <div style={{display:"flex",gap:24,alignItems:"center"}}>
      <Switch label="24/7 monitoring" defaultChecked />
      <Switch label="Email alerts" />
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
</body></html>
