<html><head><meta charset="utf-8">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Button, IconButton } = window.SaxaabDesignSystem_624abb;
const Row = ({children}) => <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:12,flexWrap:"wrap"}}>{children}</div>;
const Arrow = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>;
function Demo(){
  return <div>
    <Row>
      <Button variant="primary">Talk to us</Button>
      <Button variant="accent">Get started</Button>
      <Button variant="secondary">Get a quote</Button>
      <Button variant="outline">See services</Button>
      <Button variant="ghost">Learn more</Button>
      <Button variant="primary" disabled>Disabled</Button>
    </Row>
    <Row>
      <Button size="sm" variant="primary">Small</Button>
      <Button size="md" variant="primary">Medium</Button>
      <Button size="lg" variant="primary">Large</Button>
      <Button variant="accent">Get started <Arrow/></Button>
    </Row>
    <Row>
      <IconButton label="Next" variant="primary"><Arrow/></IconButton>
      <IconButton label="Next" variant="secondary"><Arrow/></IconButton>
      <IconButton label="Next" variant="outline"><Arrow/></IconButton>
      <IconButton label="Next" variant="ghost"><Arrow/></IconButton>
      <IconButton label="Next" size="sm" variant="outline"><Arrow/></IconButton>
    </Row>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
</body></html>
