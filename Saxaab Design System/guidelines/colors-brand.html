<!-- @dsCard group="Colors" viewport="700x170" name="Brand palette" subtitle="Navy primary · teal accent · amber highlight" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-card);font-family:var(--font-body)} a{color:var(--link)}a:hover{color:var(--link-hover)}
.row{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.sw{border-radius:var(--radius-sm);height:88px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box}
.sw b{font-size:12px;font-weight:700}.sw span{font-size:11px;opacity:.75}
.lt{color:var(--text-heading)}.dk{color:#fff}</style></head>
<body>
<div class="row">
  <div class="sw dk" style="background:var(--navy-800)"><b>navy-800</b><span>#1b3a5c</span></div>
  <div class="sw dk" style="background:var(--navy-900)"><b>navy-900</b><span>#14304a</span></div>
  <div class="sw dk" style="background:var(--teal-500)"><b>teal-500</b><span>#2ca6a4</span></div>
  <div class="sw dk" style="background:var(--teal-600)"><b>teal-600</b><span>#249a98</span></div>
  <div class="sw lt" style="background:var(--amber-500)"><b>amber-500</b><span>#e9a23b</span></div>
  <div class="sw lt" style="background:var(--teal-50);border:1px solid var(--border-default)"><b>teal-50</b><span>#edf8f7</span></div>
</div>
</body></html>
