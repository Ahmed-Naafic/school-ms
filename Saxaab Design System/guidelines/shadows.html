<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:22px;background:var(--gray-50);font-family:var(--font-body);color:var(--text-body)} a{color:var(--link)}a:hover{color:var(--link-hover)}
.row{display:flex;gap:22px}
.c{flex:1;height:96px;background:#fff;border-radius:var(--radius-lg);border:1px solid var(--border-default);display:flex;align-items:flex-end;padding:12px;box-sizing:border-box;font-size:12px;color:var(--text-muted)}</style></head>
<body>
<div class="row">
  <div class="c" style="box-shadow:var(--shadow-sm)">--shadow-sm · resting cards</div>
  <div class="c" style="box-shadow:var(--shadow-md)">--shadow-md · hover / dropdowns</div>
  <div class="c" style="box-shadow:var(--shadow-lg)">--shadow-lg · dialogs</div>
</div>
</body></html>
