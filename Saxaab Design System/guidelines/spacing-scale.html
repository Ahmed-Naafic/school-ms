<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base — --space-1 through --space-9" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--surface-card);font-family:var(--font-body);color:var(--text-body)} a{color:var(--link)}a:hover{color:var(--link-hover)}
.row{display:flex;align-items:flex-end;gap:14px}
.s{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--text-muted)}
.bar{background:var(--teal-500);border-radius:3px;width:22px}</style></head>
<body>
<div class="row">
  <div class="s"><div class="bar" style="height:4px"></div>1·4</div>
  <div class="s"><div class="bar" style="height:8px"></div>2·8</div>
  <div class="s"><div class="bar" style="height:12px"></div>3·12</div>
  <div class="s"><div class="bar" style="height:16px"></div>4·16</div>
  <div class="s"><div class="bar" style="height:24px"></div>5·24</div>
  <div class="s"><div class="bar" style="height:32px"></div>6·32</div>
  <div class="s"><div class="bar" style="height:48px"></div>7·48</div>
  <div class="s"><div class="bar" style="height:64px"></div>8·64</div>
  <div class="s"><div class="bar" style="height:96px"></div>9·96</div>
</div>
</body></html>
