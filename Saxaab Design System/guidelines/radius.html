<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="Rounded geometry echoing the circular mark" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--surface-card);font-family:var(--font-body);color:var(--text-body)} a{color:var(--link)}a:hover{color:var(--link-hover)}
.row{display:flex;gap:18px;align-items:center}
.b{width:96px;height:76px;background:var(--navy-50);border:1px solid var(--navy-100);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--navy-800);font-weight:700}</style></head>
<body>
<div class="row">
  <div class="b" style="border-radius:var(--radius-sm)">sm · 8</div>
  <div class="b" style="border-radius:var(--radius-md)">md · 12</div>
  <div class="b" style="border-radius:var(--radius-lg)">lg · 18</div>
  <div class="b" style="border-radius:var(--radius-pill);width:130px;height:44px">pill</div>
</div>
</body></html>
