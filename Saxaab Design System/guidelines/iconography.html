<!-- @dsCard group="Brand" viewport="700x150" name="Iconography" subtitle="Lucide stroke icons (CDN substitute) — teal on light, white on navy" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-card);font-family:var(--font-body);color:var(--text-body)} a{color:var(--link)}a:hover{color:var(--link-hover)}
.row{display:flex;gap:20px;align-items:center}
.ic{width:52px;height:52px;border-radius:var(--radius-md);background:var(--teal-50);display:flex;align-items:center;justify-content:center;color:var(--teal-600)}
.dk{background:var(--navy-800);color:#fff}</style></head>
<body>
<div class="row">
  <div class="ic"><i data-lucide="server" style="width:24px;height:24px"></i></div>
  <div class="ic"><i data-lucide="shield-check" style="width:24px;height:24px"></i></div>
  <div class="ic"><i data-lucide="cloud" style="width:24px;height:24px"></i></div>
  <div class="ic"><i data-lucide="headphones" style="width:24px;height:24px"></i></div>
  <div class="ic"><i data-lucide="network" style="width:24px;height:24px"></i></div>
  <div class="ic dk"><i data-lucide="wifi" style="width:24px;height:24px"></i></div>
  <div class="ic dk"><i data-lucide="lock" style="width:24px;height:24px"></i></div>
  <div style="font-size:12px;color:var(--text-muted);max-width:150px">Lucide · 2px stroke · 16/20/24px</div>
</div>
<script src="https://unpkg.com/lucide@latest"></script>
<script>lucide.createIcons();</script>
</body></html>
