<!-- @dsCard group="Brand" viewport="700x180" name="Voice & tone" subtitle="Plain, confident, service-minded — sentence case, no emoji" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--surface-card);font-family:var(--font-body);color:var(--text-body)} a{color:var(--link)}a:hover{color:var(--link-hover)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px 22px;font-size:13.5px;line-height:1.5}
.y{color:var(--success);font-weight:700}.n{color:var(--danger);font-weight:700}</style></head>
<body>
<div class="g">
  <div><span class="y">✓</span> "IT that just works."</div>
  <div><span class="n">✗</span> "REVOLUTIONARY IT SOLUTIONS!!!"</div>
  <div><span class="y">✓</span> "Talk to us" · "Get a quote"</div>
  <div><span class="n">✗</span> "Submit" · "Click here"</div>
  <div><span class="y">✓</span> "We manage your whole stack."</div>
  <div><span class="n">✗</span> "Leveraging synergistic paradigms…"</div>
  <div><span class="y">✓</span> Sentence case, digits: 24/7, 99.9%</div>
  <div><span class="n">✗</span> Title Case Headings, emoji 🚀</div>
</div>
</body></html>
