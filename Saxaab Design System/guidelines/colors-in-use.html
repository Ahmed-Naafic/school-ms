<!-- @dsCard group="Colors" viewport="700x150" name="Color in use" subtitle="Ratios: navy leads, teal accents, amber sparingly" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--gray-50);font-family:var(--font-body);color:var(--text-body)} a{color:var(--link);font-weight:600;text-decoration:none}a:hover{color:var(--link-hover)}</style></head>
<body>
<div style="display:flex;align-items:center;gap:14px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:18px 20px">
  <div style="flex:1">
    <div style="font-family:var(--font-display);font-weight:700;color:var(--text-heading);font-size:19px">Managed IT support</div>
    <div style="font-size:13.5px;color:var(--text-muted);margin-top:2px">Response in under <b style="color:var(--amber-600)">15 min</b> · <a href="#">See services</a></div>
  </div>
  <button style="font-family:var(--font-body);font-weight:700;font-size:14px;color:#fff;background:var(--navy-800);border:none;border-radius:var(--radius-pill);padding:11px 20px;cursor:pointer">Talk to us</button>
  <button style="font-family:var(--font-body);font-weight:700;font-size:14px;color:var(--teal-700);background:var(--teal-50);border:1px solid var(--teal-100);border-radius:var(--radius-pill);padding:11px 20px;cursor:pointer">Get a quote</button>
</div>
</body></html>
