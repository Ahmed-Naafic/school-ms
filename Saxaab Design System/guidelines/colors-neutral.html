<!-- @dsCard group="Colors" viewport="700x170" name="Neutrals" subtitle="Cool slate grays for text, borders, surfaces" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-card);font-family:var(--font-body)} a{color:var(--link)}a:hover{color:var(--link-hover)}
.row{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.sw{border-radius:var(--radius-sm);height:88px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-sizing:border-box;border:1px solid var(--border-default)}
.sw b{font-size:12px;font-weight:700}.sw span{font-size:11px;opacity:.75}</style></head>
<body>
<div class="row">
  <div class="sw" style="background:var(--gray-900);color:#fff"><b>gray-900</b><span>text</span></div>
  <div class="sw" style="background:var(--gray-700);color:#fff"><b>gray-700</b><span></span></div>
  <div class="sw" style="background:var(--gray-500);color:#fff"><b>gray-500</b><span>muted</span></div>
  <div class="sw" style="background:var(--gray-300)"><b>gray-300</b><span></span></div>
  <div class="sw" style="background:var(--gray-200)"><b>gray-200</b><span>border</span></div>
  <div class="sw" style="background:var(--gray-100)"><b>gray-100</b><span>sunken</span></div>
  <div class="sw" style="background:var(--gray-50)"><b>gray-50</b><span>page</span></div>
</div>
</body></html>
